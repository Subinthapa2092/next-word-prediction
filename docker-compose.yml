
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro   # mount trained weights; retrain without rebuilding the image
    environment:
      - PRODUCTION_MODEL=gru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3